dns:
  enable: true
  ipv6: false
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - rule-set:private_domain
  - +.lan
  - +.local
  - +.home.arpa
  - localhost
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.in-addr.arpa
  - +.ip6.arpa
  - time.*.com
  - time.*.gov
  - pool.ntp.org
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver: &id001
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver: &id002
  - https://cloudflare-dns.com/dns-query#节点选择
  - https://dns.google/dns-query#节点选择
  nameserver-policy:
    rule-set:private_domain: *id001
    rule-set:douyin_domain: *id001
    rule-set:apple_cn: *id001
    rule-set:cn_domain: *id001
    +.cn: *id001
    rule-set:gemini_domain: *id002
    rule-set:google_domain: *id002
    +.browserleaks.com: *id002
    +.dnsleaktest.com: *id002
    +.ipleak.net: *id002
    +.ipinfo.io: *id002
    whoami.akamai.net: *id002
  direct-nameserver: *id001
  direct-nameserver-follow-policy: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
