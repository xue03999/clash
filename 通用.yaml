mode: rule
log-level: warning
ipv6: true
allow-lan: false
unified-delay: true
tcp-concurrent: false
find-process-mode: "off"
profile:
  store-selected: true
  store-fake-ip: true
proxy-providers:
  机场订阅:
    type: http
    url: "" # 填入机场的 Mihomo/Clash 订阅链接
    path: ./proxy_providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com
      interval: 86400
      timeout: 5000
      lazy: true
    override:
      udp: true
    exclude-filter: (?i)流量|剩余|到期|过期|官网|客服|联系|邮箱|e-?mail|微信|wechat|qq|telegram群|tg群|频道|官方群|交流群|公告|通知|订阅|套餐|重置|刷新|邀请|t\.me|https?://|www\.|traffic|remaining|expire|expiry|subscription|website|support|contact|reset
dns:
  enable: true
  ipv6: false
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - rule-set:private_domain
  - +.lan
  - +.local
  - +.home.arpa
  - localhost
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.in-addr.arpa
  - +.ip6.arpa
  - time.*.com
  - time.*.gov
  - pool.ntp.org
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver: &id001
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver: &id002
  - https://cloudflare-dns.com/dns-query#节点选择
  - https://dns.google/dns-query#节点选择
  nameserver-policy:
    rule-set:private_domain: *id001
    rule-set:douyin_domain: *id001
    rule-set:apple_cn: *id001
    rule-set:cn_domain: *id001
    +.cn: *id001
    rule-set:gemini_domain: *id002
    rule-set:google_domain: *id002
    +.browserleaks.com: *id002
    +.dnsleaktest.com: *id002
    +.ipleak.net: *id002
    +.ipinfo.io: *id002
    whoami.akamai.net: *id002
  direct-nameserver: *id001
  direct-nameserver-follow-policy: true
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
proxy-groups:
- name: 节点选择
  type: select
  use:
  - 机场订阅
- name: Telegram
  type: select
  use:
  - 机场订阅
- name: X
  type: select
  use:
  - 机场订阅
- name: TikTok
  type: select
  use:
  - 机场订阅
- name: AI
  type: select
  use:
  - 机场订阅
- name: Google服务
  type: select
  use:
  - 机场订阅
- name: 微软服务
  type: select
  proxies:
  - DIRECT
  use:
  - 机场订阅
  url: http://www.msftconnecttest.com/connecttest.txt
  interval: 0
- name: 哔哩哔哩
  type: select
  proxies:
  - DIRECT
  use:
  - 机场订阅
  url: http://www.msftconnecttest.com/connecttest.txt
  interval: 0
rule-anchor:
  domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
  ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
